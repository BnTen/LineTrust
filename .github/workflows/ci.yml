name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block committed secrets
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$'; then
            echo "Refusing: secret env files must not be in git" >&2
            git ls-files | grep -E '(^|/)\.env' || true
            exit 1
          fi
          if git grep -nE 'DATABASE_URL=postgres(ql)?://[^[:space:]]+' -- \
            ':!.env.example' ':!docs/**' ':!.github/**' ':!*.md' 2>/dev/null; then
            echo "Refusing: live DATABASE_URL appears committed" >&2
            exit 1
          fi
          echo "Secret scan OK"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build must not need live Neon; dynamic routes resolve at request time.
          DATA_PUBLIC: "false"
