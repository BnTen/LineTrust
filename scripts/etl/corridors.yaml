# ART multi-corridor ETL config — RER scale (human gate S0)
# Prune: n_min=30, drop windows 01:00–04:30 (minutes 60..269)

source_id: art-idfm
weights_version: w0
n_min: 30
# Retention — human lock 2026-09-27 (Neon free): keep last 12 calendar months only
retention_months: 12
# Exclusive overnight window starts to drop (30-min buckets)
drop_window_minutes_from: 60   # 01:00
drop_window_minutes_to: 270    # 04:30 exclusive

lines:
  TBA: { line_id: IDFM:C01742, short: A, coverage: partial }
  TBB: { line_id: IDFM:C01743, short: B, coverage: partial }
  TBC: { line_id: IDFM:C01727, short: C, coverage: full }
  TBD: { line_id: IDFM:C01728, short: D, coverage: full }
  TBE: { line_id: IDFM:C01729, short: E, coverage: full }

# Seed corridors — hub/end from ART/IDFM maps; stops filled by discover or fixed seq
# Melun keeps explicit stop_seq (MVP golden path)
